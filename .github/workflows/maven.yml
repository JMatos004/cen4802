# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B package --file pom.xml

    - name: Build Docker image
      run: docker build -t tennis-score-tracker:latest .

    - name: Save Docker image
      run: docker save tennis-score-tracker:latest -o tennis-score-tracker.tar

    - name: Upload Docker image
      uses: actions/upload-artifact@v4
      with:
        name: tennis-score-tracker-image
        path: tennis-score-tracker.tar
    - name: Install ApacheBench
      run: sudo apt-get update && sudo apt-get install -y apache2-utils

    - name: Start application container
      run: |
        docker run -d --name tennis-ci-test -p 127.0.0.1:8080:8080 tennis-score-tracker:latest
        curl --fail --retry 15 --retry-all-errors --retry-connrefused --retry-delay 2 http://localhost:8080/

    - name: Run automated performance test
      run: bash scripts/performance-test.sh http://localhost:8080/

    - name: Upload performance results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: performance-test-results
        path: performance-results.txt

    - name: Stop test container
      if: always()
      run: docker rm -f tennis-ci-test || true
